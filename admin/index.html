<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mozzart Games Admin</title>
  <!-- Widget logowania Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>
    // TO JEST KLUCZOWE: Używamy nazwy mozzartstore (zgodnie z image_4877eb.png)
    const NETLIFY_SITE = "mozzartstore.netlify.app";

    // Wymuszamy na przeglądarce, żeby wiedziała, gdzie jest serwer logowania
    localStorage.setItem('netlifySiteId', NETLIFY_SITE);

    // Konfiguracja API dla Decap CMS
    window.CMS_API_CONFIG = {
      gatewayUrl: "https://" + NETLIFY_SITE + "/.netlify/identity"
    };

    // Obsługa automatycznego przeładowania po zalogowaniu
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

  <!-- Ładujemy CMS z atrybutem data-base-url, który naprawia błąd 404 z Twojego zdjęcia -->
  <script 
    src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"
    data-base-url="https://mozzartstore.netlify.app"
  ></script>
</body>
</html>
