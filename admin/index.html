<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mozzart Games Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.39.0/dist/sveltia-cms.css" />
</head>
<body>
  <script>
    // To jest "magiczna" linijka, która wyłącza szukanie Netlify
    window.netlifyIdentity = null;
    
    // To wymusza na Sveltii pokazanie pola na token zamiast szukania serwerów
    window.localStorage.setItem('sveltia-cms.auth.backend', 'github');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.39.0/dist/sveltia-cms.js" type="module"></script>
</body>
</html>
