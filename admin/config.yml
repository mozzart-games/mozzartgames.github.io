backend:
  name: github
  repo: mozzart-games/mozzartgames.github.io
  branch: main
  base_url: https://mozzartstore.netlify.app
  site_domain: mozzart-games.github.io

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
