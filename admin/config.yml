backend:
  name: github
  repo: mozzart-games/mozzartgames.github.io
  branch: main
  # Ta linia jest kluczowa, aby przestało wyskakiwać okno Netlify:
  site_id: localhost 

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Tytuł", name: "title", widget: "string"}
      - {label: "Data publikacji", name: "date", widget: "datetime"}
      - {label: "Treść", name: "body", widget: "markdown"}
