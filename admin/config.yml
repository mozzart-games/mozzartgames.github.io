backend:
  name: github
  repo: mozzart-games/mozzartgames.github.io
  branch: main
  # Zmieniamy na 'token' - to najprostsza metoda dla Sveltia CMS
  auth_type: token

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Tytuł", name: "title", widget: "string"}
      - {label: "Data publikacji", name: "date", widget: "datetime"}
      - {label: "Treść", name: "body", widget: "markdown"}
